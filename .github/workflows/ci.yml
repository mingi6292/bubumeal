name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에서 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle 캐시를 관리하고 의존성 변경도 추적한다.
      - uses: gradle/actions/setup-gradle@v4

      # local.properties(로그인 키)는 CI에 없으므로 로그인은 가짜 구현으로 빌드된다.
      - name: shared 테스트 (commonTest + androidHostTest)
        run: ./gradlew :shared:testAndroidHostTest

      - name: Android 디버그 APK 빌드
        run: ./gradlew :androidApp:assembleDebug
